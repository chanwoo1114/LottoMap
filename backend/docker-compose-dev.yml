services:
  db:
    image: postgis/postgis:16-3.4
    container_name: lotto-map-postgresql
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: lotto-map-backend:dev
    container_name: lotto-map-bootstrap
    env_file:
      - .env
    environment:
      DB_HOST: db
    command: ["python", "-m", "app.jobs.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: lotto-map-backend:dev
    container_name: lotto-map-api
    env_file:
      - .env
    environment:
      DB_HOST: db
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_started
    restart: unless-stopped

  scheduler:
    image: lotto-map-backend:dev
    container_name: lotto-map-scheduler
    env_file:
      - .env
    environment:
      DB_HOST: db
    command: ["python", "-m", "app.jobs.scheduler"]
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
